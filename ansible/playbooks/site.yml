---
- name: Hello world
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Connectivity check
      ansible.builtin.shell: >-
        echo
        host=$(hostname)
        ansible_host={{ ansible_host }}
        eth0=$(ip -4 -o addr show dev eth0 | awk '{print $4}' | cut -d/ -f1)
        uname="$(uname -a)"
      register: check
      changed_when: false

    - name: Display connectivity check
      ansible.builtin.debug:
        msg: "{{ check.stdout }}"
